schema_version = "1.4"

[task]
name = "benchmark/raft-consensus"
version = "1.0.0"
description = "Single-node Raft state machine (RequestVote/AppendEntries with log-conflict resolution, current-term commit rule, snapshot/restore) plus a deterministic multi-node cluster driver with logical timers, partitions and crash/restart."
keywords = [
    "hard",
    "raft",
    "distributed-consensus",
    "replicated-log",
]

[metadata]
benchmark_style = "NL2RepoBench"
spec_kind = "clear"
language = "python"
tier = "systems"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Modeled directly on the Raft consensus paper's leader-election and log-replication rules."
differentiation_notes = "The current-term commit rule and log-conflict truncation are the two subtlest correctness rules in Raft, both easy to skip while still passing a simple no-conflict scenario."
relevance = "Raft-like consensus underlies real production distributed databases and coordination services."
failure_cruxes = [
    "Committing a log entry by replication count alone without the current-term commit rule, which can commit an entry from a prior term unsafely.",
    "Not truncating the conflicting suffix of the follower's log on AppendEntries log-conflict resolution, leaving stale entries in place.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
