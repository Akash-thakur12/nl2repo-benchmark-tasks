schema_version = "1.4"

[task]
name = "benchmark/tor-relay"
version = "1.0.0"
description = "Onion-routing relay: layered SHA-256 counter-mode stream cipher over fixed 498-byte cell payloads, single-layer make/decrypt plus multi-hop onion wrap/peel, recognized-vs-forward classification."
keywords = [
    "hard",
    "onion-routing",
    "stream-cipher",
    "layered-encryption",
]

[metadata]
benchmark_style = "NL2RepoBench"
spec_kind = "clear"
language = "python"
tier = "systems"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Models Tor's real layered onion-routing cell-encryption design."
differentiation_notes = "Multi-hop peel order and independent per-layer counter state are both easy to conflate into a single shared cipher-stream state."
relevance = "Layered onion-encryption correctness underlies real anonymity-network relay software."
failure_cruxes = [
    "Applying the per-hop stream-cipher layers in the wrong order when peeling a multi-hop onion-wrapped cell.",
    "Sharing counter-mode keystream state across independent layers instead of keeping each hop's counter independent.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
