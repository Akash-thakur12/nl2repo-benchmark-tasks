schema_version = "1.4"

[task]
name = "benchmark/dns-resolver"
version = "1.0.0"
description = "RFC 1035 DNS: encode/parse names (compression pointers, loop-safe), build a query packet, parse full response (header flags, question/answer/authority/additional) with A/AAAA/CNAME/NS/MX/SOA/TXT rdata decoding, (qname,qtype)-keyed TTL cache, stub DNSSEC (AD bit)."
keywords = [
    "hard",
    "dns",
    "rfc1035",
    "name-compression",
]

[metadata]
benchmark_style = "RepoZero"
spec_kind = "clear"
language = "python"
tier = "systems"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Direct implementation of RFC 1035 DNS message encoding, including name compression."
differentiation_notes = "A compression-pointer loop guard is invisible until a maliciously crafted response is actually parsed, since well-formed responses never trigger it."
relevance = "DNS compression-pointer loops are a real documented denial-of-service vector in resolver implementations."
failure_cruxes = [
    "Not detecting a compression-pointer loop, causing an infinite parse loop on a malicious/malformed name.",
    "Decoding an AAAA record's 16-byte address with the A record's 4-byte field-length assumption.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
