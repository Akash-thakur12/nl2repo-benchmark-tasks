schema_version = "1.4"

[task]
name = "benchmark/redis-lite"
version = "1.0.0"
description = "String + List ops. SET/GET/DEL/LPUSH/RPOP/LRANGE. AOF persistence."
keywords = [
    "hard",
    "redis",
    "persistence",
    "in-memory-store",
]

[metadata]
benchmark_style = "NL2RepoBench"
spec_kind = "clear"
language = "python"
tier = "systems"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Models Redis's own string/list command semantics and AOF persistence model."
differentiation_notes = "AOF replay ordering for list operations is easy to get right for appends but wrong for pops, since naive replay logic often assumes append-only history."
relevance = "AOF-style persistence bugs are a real correctness risk in production in-memory data stores."
failure_cruxes = [
    "AOF replay not preserving LPUSH/RPOP ordering, reconstructing a list in the wrong order after restart.",
    "A DEL not being written to the AOF, so a deleted key reappears on replay.",
    "Handling a crash-torn final record the same way as damage in the middle of the log, or the other way round.",
    "Writing the recovery path as a transcription of the record table, so it drifts from the invariants the live command path maintains.",
    "Appending to the log before deciding whether the command is legal, leaving records for commands that were rejected.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
