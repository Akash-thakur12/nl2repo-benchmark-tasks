schema_version = "1.4"

[task]
name = "benchmark/pdf-parser"
version = "1.0.0"
description = "ISO 32000-1 PDF parser: %PDF version, indirect objects parsed into Python structures via a primitive lexer (dict/array/name/literal+hex string/number/bool/null/Ref, streams), xref table -> {(num,gen): offset}, trailer dict, startxref, and cycle-safe resolve() of indirect references."
keywords = [
    "hard",
    "pdf",
    "object-graph-resolution",
    "lexer-design",
]

[metadata]
benchmark_style = "SWE-Marathon"
spec_kind = "clear"
language = "python"
tier = "backend"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Direct implementation of the ISO 32000-1 PDF object model and lexer."
differentiation_notes = "Cycle-safety in indirect-reference resolution is invisible on well-formed PDFs and only manifests on a maliciously or accidentally self-referential object graph."
relevance = "PDF parser robustness is a real security requirement given how often PDF parsers process untrusted input."
failure_cruxes = [
    "resolve() not being cycle-safe, infinite-looping on a self-referential indirect-object graph.",
    "Conflating hex-string and literal-string escape rules, mis-decoding one as if it were the other.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
