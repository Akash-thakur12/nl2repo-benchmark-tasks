schema_version = "1.4"

[task]
name = "benchmark/markdown-renderer"
version = "1.0.0"
description = "CommonMark+GFM: headings, paragraphs, code, lists, links, bold/italic, tables."
keywords = [
    "hard",
    "markdown",
    "commonmark",
    "gfm-extensions",
]

[metadata]
benchmark_style = "RepoZero"
spec_kind = "clear"
language = "python"
tier = "backend"
origin = "oss-initial"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Models the real CommonMark + GFM specification's more intricate inline and table rules, plus a house rendering style that supersedes a retired one still on disk."
differentiation_notes = "The prescriptive inline ordering and the worked table skeleton have been removed from instruction.md; precedence, table geometry and column alignment are recoverable only from environment/docs/ and the byte-exact fixtures in environment/corpus/."
relevance = "CommonMark/GFM compliance is a real interoperability requirement for production documentation tooling."
failure_cruxes = [
    "Treating a code span as ordinary text, so markup inside it is re-interpreted and a pipe inside it splits a table row.",
    "Adding `_`/`__` emphasis as a symmetric synonym for `*`/`**`, which eats identifiers such as `my_var_name` and underscores in URL paths.",
    "Emitting one `<td>` per cell present instead of normalising every body row to the header row's column count, and letting a table be swallowed by the paragraph above it.",
    "Following the superseded HTML4 house doc and emitting `align=` on the `<th>` only, instead of `style=\"text-align: ...\"` on the whole column.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
