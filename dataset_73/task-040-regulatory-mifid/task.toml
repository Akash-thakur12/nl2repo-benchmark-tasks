schema_version = "1.4"

[task]
name = "benchmark/regulatory-mifid"
version = "1.0.0"
description = "MiFID II RTS 22 transaction-report validator: validate(record)->list of error strings (empty=valid). Required fields, SIDE/CAPACITY enums, ISO-8601 timestamp, positive price/qty, ISO 17442 LEI mod-97, ISO 6166 ISIN Luhn check digit, ISO 10383 MIC allowlist. hash_report() deterministic."
keywords = [
    "hard",
    "mifid-ii",
    "regulatory-compliance",
    "checksum-validation",
]

[metadata]
benchmark_style = "Doc2Repo"
spec_kind = "clear"
language = "python"
tier = "backend"
origin = "internal-tool"
artifact_type = ["repository"]
task_objective = ["implement"]
difficulty = "hard"
category = "systems-programming"

[metadata.difficulty_explanation]
provenance = "Direct implementation of the real ISO 17442 LEI and ISO 6166 ISIN checksum standards used in MiFID II reporting."
differentiation_notes = "A bool silently satisfying an int-positivity check in Python is a language-specific footgun that a naive isinstance-free validator won't catch."
relevance = "MiFID II transaction-report validation is a real regulatory-compliance requirement for financial institutions."
failure_cruxes = [
    "Computing the ISO 17442 LEI mod-97 checksum over the wrong substring of the 20-character code.",
    "A `bool` value passing the PRICE/QTY positivity check because `bool` is a Python `int` subclass, so `True > 0` is true.",
]

[metadata.scoring]
type = "continuous"
min_score = 0.0
max_score = 1.0
pass_threshold = 0.5

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
